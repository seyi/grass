[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grass-mcp-server"
version = "0.1.0"
description = "MCP server exposing GRASS GIS geospatial processing capabilities"
readme = "README.md"
authors = [
    { name = "GRASS Development Team", email = "grass-dev@lists.osgeo.org" }
]
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"
keywords = ["grass", "gis", "geospatial", "mcp", "model-context-protocol", "ai", "raster", "vector"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://grass.osgeo.org"
Repository = "https://github.com/OSGeo/grass"
Documentation = "https://grass.osgeo.org/grass-devel/manuals/index.html"

[project.scripts]
grass-mcp-server = "grass_mcp_server:main"

[tool.setuptools]
py-modules = ["grass_mcp_server"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []
